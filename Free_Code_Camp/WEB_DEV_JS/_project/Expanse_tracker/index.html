<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>
    

        <div class="balance-container">
            <h2>Your Balance</h2>
            <h1 id="balance">$0.00</h1>
            <h3 class="summary-title">Summary</h3>

            <div class="summary">
                
                <div class="income">
                    <h3>Total <br> Income: </h3>
                    <p id="income-ammount">$0.00</p>
                </div>

                <div class="expenses">
                    <h3>Total Expenses:</h3>
                    <p id="expenses-ammount">$0.00</p>
                </div>
            </div>
        </div>

    
    <div class="main-content">
        <div class="transaction-container">
            <h2 class="transaction-title">Transactions</h2>
            <ul id="transaction-list">
                <!-- Transactions will be dynamically added here (Generated by JavaScript)-->
            </ul>
        </div>

        <div class="form-container">
            <h2>Add Transaction</h2>

            <form id="transaction-form">
                <div class="form-group">
                    <label for="description">Description:</label>
                    <input type="text" id="description" placeholder="ADD description ..." required>
                </div>

                <div class="form-group">
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" placeholder="Enter amount" required>
                    <small>Negative (-) for expenses</small>
                </div>

                <button type="submit">Add Transaction</button>
                
            </form>
        </div>
    </div>
</body>
</html>
