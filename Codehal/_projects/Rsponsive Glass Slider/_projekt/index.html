<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>
<body>
    <section>
    <div class="sidebar">
        <div class="logo-content">
            <div class="logo">
                <i class='bx bxl-c-plus-plus'></i>
                <h3>Codehal</h3>
            </div>
            <i class='bx bx-menu' id="btn"></i>
        </div>

        <ul class="list">
            <li class="search">
                <a href="#">
                    <i class='bx bx-search'></i>
                    <input type="text" placeholder="Search...">
                   
                </a>
            </li>

            <li class="list-item">
                <a href="#">
                    <i class='bx bx-home'></i>
                    <span class="links-name">Dashboard</span>
                </a>
            </li>

            <li class="list-item">
                <a href="#">
                    <i class='bx bx-user'></i>
                    <span class="links-name">User</span>
                </a>
            </li>

            <li class="list-item">
                <a href="#">
                    <i class='bx bx-message'></i>
                    <span class="links-name">Massage</span>
                </a>
            </li>

            <li class="list-item">
                <a href="#">
                    <i class='bx bxs-analyse'></i>
                    <span class="links-name">Analytics</span>
                </a>
            </li>

            <li class="list-item">
                <a href="#">
                    <i class='bx bxs-file-md'></i>
                    <span class="links-name">File Manager</span>
                </a>
            </li>

            <li class="list-item">
                <a href="#">
                    <i class='bx bx-border-outer' ></i>
                    <span class="links-name">Order</span>
                </a>
            </li>

            <li class="list-item">
                <a href="#">
                    <i class='bx bx-save'></i>
                    <span class="links-name">Saved</span>
                </a>
            </li>

            <li class="list-item">
                <a href="#">
                    <i class='bx bx-cog'></i>
                    <span class="links-name">Settings</span>
                </a>
            </li>

            <li class="list-logout">
                <a href="#">
                    <i class='bx bx-log-out'></i>
                    <span class="links-name">LogOut</span>
                </a>
            </li>
        </ul>
    </div>
    
</body>
</html>
