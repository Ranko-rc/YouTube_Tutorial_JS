<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="heading">Body Mass Index (BMI) Calculator </h1>

        <p>Tvoje váha: (cm)</p>
        <input type="number" class="input" id="height" value="193" placeholder="Enter yout height in (cm)">
        

        <p>Tvoje výška: (kg)</p>
        <input type="number" class="input" id="weight" value="107" placeholder="Enter yout wewight in (kg)">

        <button class="btn" id="btn">Výpočet BMI</button>
        
        <input disabled type="text" class="input" id="bmi-result">

        <h4 class="info-text">Podmínka rozpětí: <span id="weight-condition"></span></h4>
    </div>



    <script src="script.js"></script>
</body>
</html>
