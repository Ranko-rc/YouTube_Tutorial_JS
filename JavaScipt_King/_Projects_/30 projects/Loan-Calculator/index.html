<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

    <h1>Úvěrová kalkulačka</h1>

    <p>Hodnota úvěru :
    <input onchange="calculateLoan()" class="input" type="number" id="loan-amount"
     min="5000" max="1000000" 
     value="10000">
</p>   

     <p>Hodnota úroku (sazba) % :
    <input onchange="calculateLoan()" class="input"type="number" id="interest-rate"
     min="0" max="100" step="0.1"
     value="10">
</p>

      <p>Doba splacení úvěru :
    <input onchange="calculateLoan()" class="input" type="number" id="mounth-to-pay"
     min="1" max="48" 
     value="12">
</p>

      <p class="payment" id="payment">Měsíční splátka :</p>
    
    </div>


    <script src="script.js"></script>
</body>
</html>
