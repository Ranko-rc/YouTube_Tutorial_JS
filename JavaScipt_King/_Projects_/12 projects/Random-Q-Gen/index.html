<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1 class="heading">Random Quote Generator</h1>
        <h2 class="quote">
            <i class="fa-solid fa-quote-left" style="color: rgba(255, 0, 0, 0.514); font-size: 1.5rem;" ></i>
            <span id="quote">Quote</span>
            <i class="fa-solid fa-quote-right" style="color: rgba(255, 0, 0, 0.534); font-size: 1.5rem;" ></i>
        </h2>
        <p class="author"> <span id="author">Author</span></p>
        <!-- <p class="quote">Click the button to generate a random quote!</p> -->
        <button class="generate-btn">Generate Quote</button>
    </div>
</body>
</html>
