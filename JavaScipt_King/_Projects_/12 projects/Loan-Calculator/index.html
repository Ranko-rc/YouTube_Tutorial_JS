<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
     <h1 class="heading">Loan Calculator</h1>

        <div class="amount">
            <p>Loan Amount: $</p>
            <input onchange="calculateLoan()" 
            type="number" id="loan-amount" value="10000" min="0" max="1000000"  placeholder="Enter loan amount">
        </div>

        <div class="interest-rate"> 
            <p>Interest rate: %</p>
            <input onchange="calculateLoan()" 
            type="number" id="interest-rate" value="10" min="0" max="100" step="0.1" placeholder="Enter interest rate">
        </div>

        <div class="months-to-pay">
            <p>Months to pay: #</p>
            <input onchange="calculateLoan()" 
            type="number" id="months-to-pay" value="12" min="6" max="48" placeholder="Enter number of months">
        </div>


        <p class="result">Monthly Payment: $<span id="monthly-payment">0.00</span></p>




    </div>
</body>
</html>
