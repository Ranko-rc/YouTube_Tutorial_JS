<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback UI
    </title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container" id="container">
        <h1 class="headoing">Feedback UI</h1>
        <div class="ratings-container" id="ratings-container">
            <div class="rating">
                <img src="https://www.svgrepo.com/show/521377/frowning-face.svg" >
                <small>Unhappy</small>
            </div>

            <div class="rating">
                <img src="https://www.svgrepo.com/show/521374/flushed-face.svg" >
                <small>Neutral</small>
            </div>

            <div class="rating">
                <img src="https://www.svgrepo.com/show/521379/grinning-face.svg" >
                <small>Statisfied</small>
            </div>
            
        </div>
        <button class="btn" id="btn">Submit</button>
    </div>
</body>
</html>
